[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "heterogeneous-mfg-liquidation"
version = "1.0.0"
description = "Research code for a heterogeneous mean-field optimal-liquidation model"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Ludwig Casaubon" }
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.11",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "cycler>=0.12",
]

[project.optional-dependencies]
dev = [
    "notebook>=7.0",
    "ipython>=9.0",
    "ipykernel>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
